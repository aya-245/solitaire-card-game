<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solitaire Card Game</title>
  <script defer src="./app.js"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<nav id="navbar">
  <h1>Marvel Solitaire</h1>

  <div id="stats">
    <p id="score"></p>
    <p id="highest-score"></p>
    <p id="timer">Time: 00:00</p>
  </div>

  <div id="buttons">
    <button id="new-game">New Game</button>
    <button id="undo-draw">Undo</button>
    <button id="pause-button">Pause</button>
    <button id="dark-mode">Dark Mode</button>
    <button id="leaderboard">Leader Board</button>
  </div>
</nav>

<div id="game">
  <div id="board">
    <div id="top-row">
      <div id="stock"></div>
      <div id="waste"></div>

      <div class="foundation" data-index="0"></div>
      <div class="foundation" data-index="1"></div>
      <div class="foundation" data-index="2"></div>
      <div class="foundation" data-index="3"></div>
    </div>

    <div id="tableau">
      <div class="pile" data-index="0"></div>
      <div class="pile" data-index="1"></div>
      <div class="pile" data-index="2"></div>
      <div class="pile" data-index="3"></div>
      <div class="pile" data-index="4"></div>
      <div class="pile" data-index="5"></div>
      <div class="pile" data-index="6"></div>
    </div>

  <div id="pause-popup" class="hidden">
      <img src="assets/miss-minutes.png" alt="Miss Minutes">
      <div>
        <p>"Welcome to the Time Variance Authority. I'm Miss Minutes, and it's my job to catch you up before you stand trial for your crimes. So let's not waste another minute."</p>
        <p id="resume-message">Click Resume to resume the game!</p>
      </div>
  </div>

  <div id="leaderboard-popup" class="hidden">
    <h2>Top 5 Scores</h2>
    <ol id="leaderboard-list"></ol>
  </div>

  <div id="win-popup" class="hidden">
    <h2>You Won!</h2>
    <p id="win-score"></p>
    <p id="win-time"></p>
    <button id="play-again">Play Again</button>
  </div>
</div>

</body>
</html>
