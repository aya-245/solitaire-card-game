<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solitaire Card Game</title>
  <script defer src="./app.js"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <h1>Solitaire</h1>

  <div id="game">

    <div id="controls">
      <button id="new-game">New Game</button>
      <p id="message"></p>
    </div>

    <div id="top-row">
      <div id="stock"></div>
      <div id="waste"></div>

      <div class="foundation" id="0"></div>
      <div class="foundation" id="1"></div>
      <div class="foundation" id="2"></div>
      <div class="foundation" id="3"></div>
    </div>

    <div id="tableau">
      <div class="pile" id="0"></div>
      <div class="pile" id="1"></div>
      <div class="pile" id="2"></div>
      <div class="pile" id="3"></div>
      <div class="pile" id="4"></div>
      <div class="pile" id="5"></div>
      <div class="pile" id="6"></div>
    </div>

  </div>
</body>
</html>
